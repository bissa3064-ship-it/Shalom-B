
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Shalom</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<form id="formLogin">
<div class="login">
  <div class="logo"><h1>SB</h1></div>
  <div class="has"><h2>Shalom Bafatá</h2><p>SISTEMA DE CONTROLE</p></div>
  <div class="laput">
    <input type="text" id="nome" placeholder="Usuário" required><br><br>
    <input type="password" id="senha" placeholder="Senha" required><br><br>
    <button type="submit" id="btn">Ingressar</button><br><br>
    <p id="msg" style="color:red; display:none;"></p>
  </div>
</div>
</form>

<script>
async function gerarHash(t){
  const b=new TextEncoder().encode(t);
  const h=await crypto.subtle.digest('SHA-256',b);
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
document.getElementById('formLogin').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn');
  btn.textContent="Verificando..."; btn.disabled=true;
  const hashD=await gerarHash(document.getElementById('senha').value);
  const hashC=await gerarHash("#Shalom@20.26");
  if(hashD===hashC){
    sessionStorage.setItem('auth_shalom',hashC);
    window.open("index.html", "_blank");
    btn.textContent="Ingressar"; btn.disabled=false;
  }else{
    document.getElementById('msg').textContent="Acesso negado!";
    document.getElementById('msg').style.display="block";
    document.getElementById('senha').value="";
    btn.textContent="Ingressar"; btn.disabled=false;
    setTimeout(()=>document.getElementById('msg').style.display="none",3000);
  }
});
</script>
</body>
</html>
